# 전각도 낙하(sphere) 리비전 연합 비교 예제
kind: auto
baseline: 1
output: federate_sphere.html

reports:
  - path: /data/proj/revA/report.json
    label: "RevA"
  - path: /data/proj/revB/report.json
    label: "RevB"

options:
  auto_match_identical: true
  name_normalize: true
  unmatched: show
  # nearest = baseline 각도를 공통 격자로 쓰고 나머지는 최근접 실측을 붙인다.
  # 짝을 못 찾은 각도는 미판정으로 남지만 값은 전부 실측이다 (권장).
  # idw 는 새 Fibonacci 격자를 만들어 100% 커버리지를 얻는 대신 모든 셀이
  # 보간값이 된다 — 실측 데이터에서 실측률 0%, 피크 -40~-46% 감쇠가 나왔다.
  resample: nearest             # nearest | idw | off
  trust_gate: true
  unit_policy: error

parts: {}                       # 전부 동일 이름이면 매칭표 생략 가능
