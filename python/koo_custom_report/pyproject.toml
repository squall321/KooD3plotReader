[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "koo_custom_report"
version = "0.1.0"
description = "LS-DYNA *SET_ definitions based custom post-processing report"
requires-python = ">=3.10"
authors = [{ name = "KooD3plotReader" }]
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
koo_custom_report = "koo_custom_report.__main__:main"

[tool.setuptools.packages.find]
include = ["koo_custom_report*"]
